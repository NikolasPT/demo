<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tic Tac Toe</title>

  <!-- Apply stored or system theme as early as possible to avoid flash -->
  <script>
    (function () {
      try {
        const THEME_KEY = 'ttt_theme';
        const stored = localStorage.getItem(THEME_KEY);
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.setAttribute('data-theme', stored);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      } catch (e) { /* ignore */ }
    })();
  </script>

  <style>
    :root {
      --bg: #0f1724;
      --bg-end: #071021; /* used for gradient end stop */

      --x: #e11d48;
      --o: #06b6d4;
      --muted: #94a3b8;
      --text: #e6eef8;
      color-scheme: dark;

      /* Surface variables for overlays/borders so themes can override consistently */
      --surface-bg: rgba(255,255,255,0.02);
      --surface-border: rgba(255,255,255,0.04);
      --surface-overlay: rgba(255,255,255,0.01);
      --surface-overlay-strong: rgba(255,255,255,0.02);
      --btn-border: rgba(255,255,255,0.06);
    }

    /* Light theme overrides applied when document.documentElement has data-theme="light" */
    :root[data-theme="light"] {
      --bg: #f8fafc; /* slate-50 */
      --bg-end: #f1f5f9; /* light gradient end */

      --x: #dc2626; /* red-600 */
      --o: #0ea5a4; /* teal-ish */
      --muted: #475569; /* slate-600 */
      --text: #0f1724; /* slate-900 */
      color-scheme: light;

      --surface-bg: rgba(2,6,23,0.03);
      --surface-border: rgba(2,6,23,0.04);
      --surface-overlay: rgba(2,6,23,0.015);
      --surface-overlay-strong: rgba(2,6,23,0.03);
      --btn-border: rgba(2,6,23,0.06);
    }

    * {
      box-sizing: border-box;
    }

    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, var(--bg), var(--bg-end) 120%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: var(--text);
    }

    .ttt__container {
      width: 100%;
      max-width: 720px;
      background: var(--surface-bg);
      border-radius: 12px;
      padding: 20px 20px 28px;
      box-shadow: 0 6px 30px rgba(2,6,23,0.6);
      position: relative;
      overflow: visible;
      border: 1px solid transparent;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    h1 { font-size: 20px; margin: 0; }

    .ttt__status { display: flex; flex-direction: column; align-items: flex-end; }
    .ttt__status-msg { font-weight: 600; }
    .ttt__status-sub { font-size: 13px; color: var(--muted); }

    .ttt__header-actions { display:flex; align-items:center; gap:12px; }

    .ttt__board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 18px 0;
    }

    .ttt__cell {
      aspect-ratio: 1/1;
      padding: 0;
      border-radius: 10px;
      border: 2px solid var(--surface-border);
      background: linear-gradient(180deg, var(--surface-overlay), transparent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(2rem, 10vw, 7rem);
      line-height: 1;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }

    .ttt__cell:focus { outline: 3px solid rgba(124,58,237,0.18); }

    .ttt__cell--x { color: var(--x); }
    .ttt__cell--o { color: var(--o); }

    .ttt__controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .ttt__btn {
      background: transparent;
      border: 1px solid var(--btn-border);
      color: inherit;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
    }

    .ttt__btn--primary {
      background: linear-gradient(90deg, #4f46e5, #7c3aed);
      border: none;
      color: white;
    }

    .ttt__score { display: flex; gap: 12px; align-items: center; color: var(--muted); font-size: 14px; }
    .ttt__score-item { display: inline-flex; gap: 6px; align-items: center; background: var(--surface-overlay-strong); padding: 6px 8px; border-radius: 8px; }

    @media (max-width: 420px) {
      :root { --mark-vw-factor: 18vw; }
      .ttt__container { padding: 14px; }
    }

  </style>
</head>
<body>
  <main class="ttt__container">
    <header>
      <h1>Tic Tac Toe</h1>
      <div class="ttt__header-actions">
        <button id="themeToggle" class="ttt__btn" aria-pressed="false" aria-label="Toggle theme">🌙</button>
        <div class="ttt__status">
          <div id="statusMsg" class="ttt__status-msg" aria-live="polite">Waiting...</div>
          <div class="ttt__status-sub">Click a cell or use keyboard (Tab + Enter/Space)</div>
        </div>
      </div>
    </header>

    <section class="ttt__board" role="grid" aria-label="Tic Tac Toe board">
      <button class="ttt__cell" data-index="0" aria-label="Row 1, Column 1, empty" aria-pressed="false"></button>
      <button class="ttt__cell" data-index="1" aria-label="Row 1, Column 2, empty" aria-pressed="false"></button>
      <button class="ttt__cell" data-index="2" aria-label="Row 1, Column 3, empty" aria-pressed="false"></button>
      <button class="ttt__cell" data-index="3" aria-label="Row 2, Column 1, empty" aria-pressed="false"></button>
      <button class="ttt__cell" data-index="4" aria-label="Row 2, Column 2, empty" aria-pressed="false"></button>
      <button class="ttt__cell" data-index="5" aria-label="Row 2, Column 3, empty" aria-pressed="false"></button>
      <button class="ttt__cell" data-index="6" aria-label="Row 3, Column 1, empty" aria-pressed="false"></button>
      <button class="ttt__cell" data-index="7" aria-label="Row 3, Column 2, empty" aria-pressed="false"></button>
      <button class="ttt__cell" data-index="8" aria-label="Row 3, Column 3, empty" aria-pressed="false"></button>
    </section>

    <div class="ttt__controls">
      <div class="ttt__score">
        <span id="scoreX" class="ttt__score-item">X: 0</span>
        <span id="scoreO" class="ttt__score-item">O: 0</span>
        <span id="scoreD" class="ttt__score-item">Draws: 0</span>
      </div>

      <div style="display:flex; gap:8px; align-items:center;">
        <div style="display:inline-flex; gap:8px; align-items:center;">
          <label for="gameMode" style="font-size:13px;color:var(--muted);">Mode</label>
          <select id="gameMode" class="ttt__btn" aria-label="Game mode">
            <option value="pvp">Two players</option>
            <option value="pvc">Vs Computer</option>
          </select>
          <label for="playerMark" style="font-size:13px;color:var(--muted);">You</label>
          <select id="playerMark" class="ttt__btn" aria-label="Choose your mark">
            <option value="X">X</option>
            <option value="O">O</option>
          </select>
        </div>

        <button id="newGame" class="ttt__btn ttt__btn--primary">New Game</button>
        <button id="resetScores" class="ttt__btn" title="Reset scores">Reset Scores</button>
      </div>
    </div>
  </main>

  <script>
    (function () {
      const cellEls = Array.from(document.querySelectorAll('.ttt__cell'));
      const statusEl = document.getElementById('statusMsg');
      const newGameBtn = document.getElementById('newGame');
      const resetScoresBtn = document.getElementById('resetScores');
      const scoreXEl = document.getElementById('scoreX');
      const scoreOEl = document.getElementById('scoreO');
      const scoreDEl = document.getElementById('scoreD');
      const themeToggle = document.getElementById('themeToggle');

      // PvC controls
      const gameModeEl = document.getElementById('gameMode');
      const playerMarkEl = document.getElementById('playerMark');

      const THEME_KEY = 'ttt_theme';

      const WINNING_COMBOS = [
        [0,1,2], [3,4,5], [6,7,8],
        [0,3,6], [1,4,7], [2,5,8],
        [0,4,8], [2,4,6]
      ];

      // Visual mapping for marks (presentational only)
      const VISUAL_MARK = { X: 'X', O: 'O' };
      function playerName(p) {
        if (!p) return 'empty';
        const up = String(p).toUpperCase();
        if (up === 'X') return 'X';
        if (up === 'O') return 'O';
        return up;
      }

      let board = Array(9).fill('');
      let currentPlayer = 'X';
      let isGameActive = true;
      const SCORE = { X: 0, O: 0, draws: 0 };

      // New PvC state
      let gameMode = 'pvp'; // 'pvp' or 'pvc'
      let humanPlayer = 'X';
      let computerPlayer = 'O';
      let aiThinking = false;

      function applyTheme(theme) {
        const t = theme === 'light' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', t);
        // update toggle UI
        if (themeToggle) {
          const isLight = t === 'light';
          themeToggle.setAttribute('aria-pressed', String(isLight));
          themeToggle.setAttribute('aria-label', isLight ? 'Switch to dark theme' : 'Switch to light theme');
          themeToggle.textContent = isLight ? '☀️' : '🌙';
        }
      }

      function toggleTheme() {
        const current = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
        const next = current === 'light' ? 'dark' : 'light';
        try { localStorage.setItem(THEME_KEY, next); } catch (e) { /* ignore */ }
        applyTheme(next);
      }

      function detectPreferredTheme() {
        try {
          const stored = localStorage.getItem(THEME_KEY);
          if (stored === 'light' || stored === 'dark') return stored;
        } catch (e) { /* ignore */ }

        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
          return 'light';
        }

        return 'dark';
      }

      function init() {
        cellEls.forEach(cell => {
          cell.addEventListener('click', onCellClick);
          cell.addEventListener('keydown', onCellKeyDown);
        });

        newGameBtn.addEventListener('click', resetGame);
        resetScoresBtn.addEventListener('click', resetScores);

        if (themeToggle) {
          themeToggle.addEventListener('click', toggleTheme);
        }

        // PvC controls
        if (gameModeEl) {
          // initialize from stored or default
          try {
            const storedMode = localStorage.getItem('ttt_mode');
            if (storedMode === 'pvp' || storedMode === 'pvc') {
              gameMode = storedMode;
            }
          } catch (e) { /* ignore */ }

          gameModeEl.value = gameMode;
          gameModeEl.addEventListener('change', (e) => {
            gameMode = e.target.value === 'pvc' ? 'pvc' : 'pvp';
            try { localStorage.setItem('ttt_mode', gameMode); } catch (e) { /* ignore */ }

            // If switching to pvc and the computer should move now, trigger it after a short delay
            if (gameMode === 'pvc' && isGameActive && currentPlayer === computerPlayer && !aiThinking) {
              setTimeout(runAIMove, 300);
            }
          });
        }

        if (playerMarkEl) {
          try {
            const storedMark = localStorage.getItem('ttt_human_mark');
            if (storedMark === 'X' || storedMark === 'O') {
              humanPlayer = storedMark;
              computerPlayer = humanPlayer === 'X' ? 'O' : 'X';
            }
          } catch (e) { /* ignore */ }

          playerMarkEl.value = humanPlayer;
          playerMarkEl.addEventListener('change', (e) => {
            const newMark = e.target.value === 'O' ? 'O' : 'X';
            humanPlayer = newMark;
            computerPlayer = humanPlayer === 'X' ? 'O' : 'X';
            try { localStorage.setItem('ttt_human_mark', humanPlayer); } catch (e) { /* ignore */ }

            // If game is active and it's now the computer's turn, let the AI move
            if (isGameActive && gameMode === 'pvc' && currentPlayer === computerPlayer && !aiThinking) {
              setTimeout(runAIMove, 300);
            }
          });
        }

        // Apply theme early based on stored preference or system (also set earlier in head to avoid flash)
        applyTheme(detectPreferredTheme());

        updateStatus(`Player ${playerName(currentPlayer)}'s turn`);
        render();

        // If starting in PvC and computer starts, trigger first move
        if (gameMode === 'pvc' && currentPlayer === computerPlayer) {
          setTimeout(runAIMove, 300);
        }
      }

      function onCellKeyDown(e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          e.target.click();
        }
      }

      function onCellClick(e) {
        const idx = Number(e.currentTarget.dataset.index);

        if (!isGameActive) {
          return;
        }

        // Prevent human interaction if AI is thinking or it's computer's turn
        if (gameMode === 'pvc' && (aiThinking || currentPlayer === computerPlayer)) {
          return;
        }

        if (board[idx]) {
          return;
        }

        placeMove(idx);
      }

      function placeMove(idx) {
        // guard: index must be empty and game active
        if (!isGameActive || board[idx]) return;

        board[idx] = currentPlayer;
        updateCellUI(idx);

        if (checkWin()) {
          isGameActive = false;
          updateStatus(`Player ${playerName(currentPlayer)} wins! Click New Game to play again.`);
          SCORE[currentPlayer] = SCORE[currentPlayer] + 1;
          updateScoreUI();

          return;
        }

        if (checkDraw()) {
          isGameActive = false;
          updateStatus('Draw! Click New Game to play again.');
          SCORE.draws = SCORE.draws + 1;
          updateScoreUI();

          return;
        }

        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';
        updateStatus(`Player ${playerName(currentPlayer)}'s turn`);

        // If PvC and it's the computer's turn, schedule an AI move
        if (gameMode === 'pvc' && currentPlayer === computerPlayer && isGameActive && !aiThinking) {
          setTimeout(runAIMove, 300);
        }
      }

      function updateCellUI(idx) {
        const cell = cellEls[idx];
        const val = board[idx];
        // use plain marks for display while keeping board values as 'X'/'O'
        cell.textContent = val ? VISUAL_MARK[val] : '';
        cell.classList.remove('ttt__cell--x','ttt__cell--o');

        if (val) {
          cell.classList.add(`ttt__cell--${val.toLowerCase()}`);
        }

        const row = Math.floor(idx / 3) + 1;
        const col = (idx % 3) + 1;
        const label = `Row ${row}, Column ${col}, ${board[idx] ? playerName(board[idx]) : 'empty'}`;
        cell.setAttribute('aria-label', label);
        cell.setAttribute('aria-pressed', board[idx] ? 'true' : 'false');
      }

      function checkWin() {
        return checkWinForBoard(board) !== null;
      }

      function checkDraw() {
        return checkDrawForBoard(board);
      }

      function updateStatus(text) {
        statusEl.textContent = text;
      }

      function resetGame() {
        board = Array(9).fill('');
        currentPlayer = 'X';
        isGameActive = true;

        cellEls.forEach((cell, i) => {
          cell.textContent = '';
          cell.classList.remove('ttt__cell--x','ttt__cell--o');

          const r = Math.floor(i / 3) + 1;
          const c = (i % 3) + 1;

          cell.setAttribute('aria-label', `Row ${r}, Column ${c}, empty`);
          cell.setAttribute('aria-pressed', 'false');
        });

        updateStatus(`Player ${playerName(currentPlayer)}'s turn`);
        render();

        // focus first cell for accessibility
        try { cellEls[0].focus(); } catch (e) { /* ignore */ }

        // If PvC and computer starts (human chose O), trigger AI move
        if (gameMode === 'pvc' && currentPlayer === computerPlayer) {
          setTimeout(runAIMove, 300);
        }
      }

      function resetScores() {
        SCORE.X = 0;
        SCORE.O = 0;
        SCORE.draws = 0;
        updateScoreUI();
      }

      function updateScoreUI() {
        scoreXEl.textContent = `X: ${SCORE.X}`;
        scoreOEl.textContent = `O: ${SCORE.O}`;
        scoreDEl.textContent = `Draws: ${SCORE.draws}`;
      }

      function render() {
        cellEls.forEach((cell, i) => {
          const val = board[i];
          cell.textContent = val ? VISUAL_MARK[val] : '';
          cell.classList.remove('ttt__cell--x','ttt__cell--o');

          if (val) {
            cell.classList.add(`ttt__cell--${val.toLowerCase()}`);
          }
        });

        updateScoreUI();
      }

      // --- Helpers for AI (minimax) ---
      function checkWinForBoard(b) {
        for (let i = 0; i < WINNING_COMBOS.length; i++) {
          const [a, x, y] = WINNING_COMBOS[i];
          if (b[a] && b[a] === b[x] && b[a] === b[y]) {
            return b[a];
          }
        }
        return null;
      }

      function checkDrawForBoard(b) {
        return b.every(v => v);
      }

      function findBestMove(boardState, aiMark) {
        // returns best index (0-8) for aiMark on boardState
        const result = minimax(boardState.slice(), aiMark, 0, true);
        return result.index;
      }

      // minimax returns { score, index }
      function minimax(b, playerMark, depth, isRoot) {
        const winner = checkWinForBoard(b);
        if (winner) {
          if (winner === playerMark) {
            return { score: 10 - depth };
          } else {
            return { score: depth - 10 };
          }
        }

        if (checkDrawForBoard(b)) {
          return { score: 0 };
        }

        const current = currentTurnInMinimax(b);
        const isMaximizing = current === playerMark;

        let best = { score: isMaximizing ? -Infinity : Infinity, index: -1 };

        for (let i = 0; i < b.length; i++) {
          if (b[i]) continue;
          b[i] = current; // make move

          const res = minimax(b, playerMark, depth + 1, false);
          b[i] = '';

          if (isMaximizing) {
            if (res.score > best.score) {
              best.score = res.score;
              best.index = i;
            }
          } else {
            if (res.score < best.score) {
              best.score = res.score;
              best.index = i;
            }
          }
        }

        return best;
      }

      function currentTurnInMinimax(b) {
        // Count marks to determine whose turn it is on board b
        const xCount = b.filter(v => v === 'X').length;
        const oCount = b.filter(v => v === 'O').length;
        return xCount === oCount ? 'X' : 'O';
      }

      function runAIMove() {
        if (!isGameActive) return;
        if (aiThinking) return;
        if (gameMode !== 'pvc') return;
        if (currentPlayer !== computerPlayer) return;

        aiThinking = true;
        updateStatus('Computer is thinking...');

        // compute move synchronously (fast)
        const idx = findBestMove(board, computerPlayer);

        // ensure the chosen index is valid; fallback to first empty
        let finalIdx = idx;
        if (typeof finalIdx !== 'number' || board[finalIdx]) {
          finalIdx = board.findIndex(v => !v);
        }

        // small delay to make it feel natural
        setTimeout(() => {
          aiThinking = false;
          placeMove(finalIdx);
        }, 200);
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>

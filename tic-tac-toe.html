<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tic Tac Toe</title>
  <style>
    :root {
      --bg: #0f1724;
      --x: #e11d48;
      --o: #06b6d4;
      --muted: #94a3b8;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, var(--bg), #071021 120%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #e6eef8;
    }

    .ttt__container {
      width: 100%;
      max-width: 720px;
      background: rgba(255,255,255,0.02);
      border-radius: 12px;
      padding: 20px 20px 28px;
      box-shadow: 0 6px 30px rgba(2,6,23,0.6);
      position: relative;
      overflow: visible;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    h1 { font-size: 20px; margin: 0; }

    .ttt__status { display: flex; flex-direction: column; align-items: flex-end; }
    .ttt__status-msg { font-weight: 600; }
    .ttt__status-sub { font-size: 13px; color: var(--muted); }

    .ttt__board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 18px 0;
    }

    .ttt__cell {
      aspect-ratio: 1/1;
      padding: 0;
      border-radius: 10px;
      border: 2px solid rgba(255,255,255,0.04);
      background: linear-gradient(180deg, rgba(255,255,255,0.01), transparent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(2rem, 10vw, 7rem);
      line-height: 1;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }

    .ttt__cell:focus { outline: 3px solid rgba(124,58,237,0.18); }

    .ttt__cell--x { color: var(--x); }
    .ttt__cell--o { color: var(--o); }

    .ttt__controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .ttt__btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.06);
      color: inherit;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
    }

    .ttt__btn--primary {
      background: linear-gradient(90deg, #4f46e5, #7c3aed);
      border: none;
      color: white;
    }

    .ttt__score { display: flex; gap: 12px; align-items: center; color: var(--muted); font-size: 14px; }
    .ttt__score-item { display: inline-flex; gap: 6px; align-items: center; background: rgba(255,255,255,0.02); padding: 6px 8px; border-radius: 8px; }

    /* Play vs Computer checkbox as inline control */
    .ttt__play-computer {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.06);
      background: rgba(255,255,255,0.01);
      color: var(--muted);
      font-size: 14px;
      cursor: pointer;
    }

    .ttt__play-computer input { width: 16px; height: 16px; }

    @media (max-width: 420px) {
      :root { --mark-vw-factor: 18vw; }
      .ttt__container { padding: 14px; }
    }

  </style>
</head>
<body>
  <main class="ttt__container">
    <header>
      <h1>Tic Tac Toe</h1>
      <div class="ttt__status">
        <div id="statusMsg" class="ttt__status-msg" aria-live="polite">Waiting...</div>
        <div class="ttt__status-sub">Click a cell or use keyboard (Tab + Enter/Space)</div>
      </div>
    </header>

    <section class="ttt__board" role="grid" aria-label="Tic Tac Toe board">
      <button class="ttt__cell" data-index="0" aria-label="Row 1, Column 1, empty" aria-pressed="false"></button>
      <button class="ttt__cell" data-index="1" aria-label="Row 1, Column 2, empty" aria-pressed="false"></button>
      <button class="ttt__cell" data-index="2" aria-label="Row 1, Column 3, empty" aria-pressed="false"></button>
      <button class="ttt__cell" data-index="3" aria-label="Row 2, Column 1, empty" aria-pressed="false"></button>
      <button class="ttt__cell" data-index="4" aria-label="Row 2, Column 2, empty" aria-pressed="false"></button>
      <button class="ttt__cell" data-index="5" aria-label="Row 2, Column 3, empty" aria-pressed="false"></button>
      <button class="ttt__cell" data-index="6" aria-label="Row 3, Column 1, empty" aria-pressed="false"></button>
      <button class="ttt__cell" data-index="7" aria-label="Row 3, Column 2, empty" aria-pressed="false"></button>
      <button class="ttt__cell" data-index="8" aria-label="Row 3, Column 3, empty" aria-pressed="false"></button>
    </section>

    <div class="ttt__controls">
      <div class="ttt__score">
        <span id="scoreX" class="ttt__score-item">X: 0</span>
        <span id="scoreO" class="ttt__score-item">O: 0</span>
        <span id="scoreD" class="ttt__score-item">Draws: 0</span>
      </div>

      <div style="display:flex;gap:8px;align-items:center;">
        <label class="ttt__play-computer" for="playComputer">
          <input type="checkbox" id="playComputer" />
          <span>Play vs Computer (Computer = O)</span>
        </label>
        <button id="newGame" class="ttt__btn ttt__btn--primary">New Game</button>
        <button id="resetScores" class="ttt__btn" title="Reset scores">Reset Scores</button>
      </div>
    </div>
  </main>

  <script>
    (function () {
      const cellEls = Array.from(document.querySelectorAll('.ttt__cell'));
      const statusEl = document.getElementById('statusMsg');
      const newGameBtn = document.getElementById('newGame');
      const resetScoresBtn = document.getElementById('resetScores');
      const scoreXEl = document.getElementById('scoreX');
      const scoreOEl = document.getElementById('scoreO');
      const scoreDEl = document.getElementById('scoreD');
      const playComputerCheckbox = document.getElementById('playComputer');

      const WINNING_COMBOS = [
        [0,1,2], [3,4,5], [6,7,8],
        [0,3,6], [1,4,7], [2,5,8],
        [0,4,8], [2,4,6]
      ];

      // Visual mapping for marks (presentational only)
      const VISUAL_MARK = { X: 'X', O: 'O' };
      function playerName(p) {
        if (!p) return 'empty';
        const up = String(p).toUpperCase();
        if (up === 'X') return 'X';
        if (up === 'O') return 'O';
        return up;
      }

      let board = Array(9).fill('');
      let currentPlayer = 'X';
      let isGameActive = true;
      let playVsComputer = false; // whether the computer is playing as O
      const SCORE = { X: 0, O: 0, draws: 0 };
      let computerTimeout = null;

      function init() {
        cellEls.forEach(cell => {
          cell.addEventListener('click', onCellClick);
          cell.addEventListener('keydown', onCellKeyDown);
        });

        newGameBtn.addEventListener('click', resetGame);
        resetScoresBtn.addEventListener('click', resetScores);

        playVsComputer = !!playComputerCheckbox.checked;
        playComputerCheckbox.addEventListener('change', () => {
          // toggle mode and reset game for consistency
          playVsComputer = !!playComputerCheckbox.checked;
          resetGame();
        });

        updateStatus(`Player ${playerName(currentPlayer)}'s turn`);
        render();
      }

      function onCellKeyDown(e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          e.target.click();
        }
      }

      function onCellClick(e) {
        const idx = Number(e.currentTarget.dataset.index);

        if (!isGameActive) {
          return;
        }

        // If playing vs computer and it's the computer's turn, ignore human clicks
        if (playVsComputer && currentPlayer === 'O') {
          return;
        }

        if (board[idx]) {
          return;
        }

        placeMove(idx);
      }

      function placeMove(idx) {
        board[idx] = currentPlayer;
        updateCellUI(idx);

        if (checkWin()) {
          isGameActive = false;

          // If playing vs computer and O won, show "Computer wins"
          if (playVsComputer && currentPlayer === 'O') {
            updateStatus('Computer wins! Click New Game to play again.');
          } else {
            updateStatus(`Player ${playerName(currentPlayer)} wins! Click New Game to play again.`);
          }

          SCORE[currentPlayer] = SCORE[currentPlayer] + 1;
          updateScoreUI();

          // clear any pending computer action
          clearPendingComputerMove();

          return;
        }

        if (checkDraw()) {
          isGameActive = false;
          updateStatus('Draw! Click New Game to play again.');
          SCORE.draws = SCORE.draws + 1;
          updateScoreUI();

          clearPendingComputerMove();

          return;
        }

        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';

        // If enabled and it's computer's turn, schedule computer move
        if (playVsComputer && currentPlayer === 'O' && isGameActive) {
          scheduleComputerMove();
          return;
        }

        updateStatus(`Player ${playerName(currentPlayer)}'s turn`);
      }

      function updateCellUI(idx) {
        const cell = cellEls[idx];
        const val = board[idx];
        // use plain marks for display while keeping board values as 'X'/'O'
        cell.textContent = val ? VISUAL_MARK[val] : '';
        cell.classList.remove('ttt__cell--x','ttt__cell--o');

        if (val) {
          cell.classList.add(`ttt__cell--${val.toLowerCase()}`);
        }

        const row = Math.floor(idx / 3) + 1;
        const col = (idx % 3) + 1;
        const label = `Row ${row}, Column ${col}, ${board[idx] ? playerName(board[idx]) : 'empty'}`;
        cell.setAttribute('aria-label', label);
        cell.setAttribute('aria-pressed', board[idx] ? 'true' : 'false');
      }

      function checkWin() {
        for (let i = 0; i < WINNING_COMBOS.length; i++) {
          const combo = WINNING_COMBOS[i];
          const a = combo[0];
          const b = combo[1];
          const c = combo[2];

          if (board[a] && board[a] === board[b] && board[a] === board[c]) {
            return true;
          }
        }

        return false;
      }

      function checkDraw() {
        return board.every(v => v);
      }

      function updateStatus(text) {
        statusEl.textContent = text;
      }

      function resetGame() {
        // clear any pending computer moves
        clearPendingComputerMove();

        board = Array(9).fill('');
        currentPlayer = 'X';
        isGameActive = true;

        cellEls.forEach((cell, i) => {
          cell.textContent = '';
          cell.classList.remove('ttt__cell--x','ttt__cell--o');

          const r = Math.floor(i / 3) + 1;
          const c = (i % 3) + 1;

          cell.setAttribute('aria-label', `Row ${r}, Column ${c}, empty`);
          cell.setAttribute('aria-pressed', 'false');
        });

        updateStatus(`Player ${playerName(currentPlayer)}'s turn`);
        render();

        // focus first cell for accessibility
        try { cellEls[0].focus(); } catch (e) { /* ignore */ }
      }

      function resetScores() {
        SCORE.X = 0;
        SCORE.O = 0;
        SCORE.draws = 0;
        updateScoreUI();
      }

      function updateScoreUI() {
        scoreXEl.textContent = `X: ${SCORE.X}`;
        scoreOEl.textContent = `O: ${SCORE.O}`;
        scoreDEl.textContent = `Draws: ${SCORE.draws}`;
      }

      function render() {
        cellEls.forEach((cell, i) => {
          const val = board[i];
          cell.textContent = val ? VISUAL_MARK[val] : '';
          cell.classList.remove('ttt__cell--x','ttt__cell--o');

          if (val) {
            cell.classList.add(`ttt__cell--${val.toLowerCase()}`);
          }
        });

        updateScoreUI();
      }

      function clearPendingComputerMove() {
        if (computerTimeout) {
          clearTimeout(computerTimeout);
          computerTimeout = null;
        }
      }

      function scheduleComputerMove() {
        if (!isGameActive || currentPlayer !== 'O') return;
        updateStatus('Computer is thinking...');
        clearPendingComputerMove();
        computerTimeout = setTimeout(() => {
          computerTimeout = null;
          if (!isGameActive || currentPlayer !== 'O') return;
          const idx = findComputerMove();
          if (typeof idx === 'number' && idx >= 0) {
            placeMove(idx);
          }
        }, 350 + Math.floor(Math.random() * 150));
      }

      function findComputerMove() {
        const empty = board.map((v,i) => v ? null : i).filter(v => v !== null);

        // 1) Win if possible
        for (let i = 0; i < empty.length; i++) {
          const idx = empty[i];
          const clone = board.slice();
          clone[idx] = 'O';
          if (checkWinsForMark(clone, 'O')) return idx;
        }

        // 2) Block opponent win
        for (let i = 0; i < empty.length; i++) {
          const idx = empty[i];
          const clone = board.slice();
          clone[idx] = 'X';
          if (checkWinsForMark(clone, 'X')) return idx;
        }

        // 3) Take center
        if (!board[4]) return 4;

        // 4) Take a corner
        const corners = [0,2,6,8];
        for (let i = 0; i < corners.length; i++) {
          if (!board[corners[i]]) return corners[i];
        }

        // 5) Fallback to first available
        return board.findIndex(v => !v);
      }

      function checkWinsForMark(simBoard, mark) {
        for (let i = 0; i < WINNING_COMBOS.length; i++) {
          const [a,b,c] = WINNING_COMBOS[i];
          if (simBoard[a] === mark && simBoard[b] === mark && simBoard[c] === mark) return true;
        }
        return false;
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>

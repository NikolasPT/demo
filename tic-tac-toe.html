<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Tic Tac Toe</title>
  <style>
    :root {
      --bg: #0f1724;
      --x: #e11d48;
      --o: #06b6d4;
      --muted: #94a3b8;
      color-scheme: dark;
    }

    * {
      box-sizing: border-box;
    }

    html, body { height: 100%; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, var(--bg), #071021 120%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #e6eef8;
    }

    .ttt__container {
      width: 100%;
      max-width: 720px;
      background: rgba(255,255,255,0.02);
      border-radius: 12px;
      padding: 20px 20px 28px;
      box-shadow: 0 6px 30px rgba(2,6,23,0.6);
      position: relative;
      overflow: visible;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 14px;
    }

    h1 { font-size: 20px; margin: 0; }

    .ttt__status { display: flex; flex-direction: column; align-items: flex-end; }
    .ttt__status-msg { font-weight: 600; }
    .ttt__status-sub { font-size: 13px; color: var(--muted); }

    .ttt__board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 18px 0;
    }

    .ttt__cell {
      aspect-ratio: 1/1;
      padding: 0;
      border-radius: 10px;
      border: 2px solid rgba(255,255,255,0.04);
      background: linear-gradient(180deg, rgba(255,255,255,0.01), transparent);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(2rem, 10vw, 7rem);
      line-height: 1;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
      user-select: none;
    }

    .ttt__cell:focus { outline: 3px solid rgba(124,58,237,0.18); }

    .ttt__cell--x { color: var(--x); }
    .ttt__cell--o { color: var(--o); }

    .ttt__controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .ttt__btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.06);
      color: inherit;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 160ms ease, border-color 160ms ease, color 160ms ease;
    }

    .ttt__btn--primary {
      background: linear-gradient(90deg, #4f46e5, #7c3aed);
      border: none;
      color: white;
    }

    .ttt__score { display: flex; gap: 12px; align-items: center; color: var(--muted); font-size: 14px; }
    .ttt__score-item { display: inline-flex; gap: 6px; align-items: center; background: rgba(255,255,255,0.02); padding: 6px 8px; border-radius: 8px; }

    /* Game mode selector styling */
    .ttt__mode {
      display: inline-flex;
      gap: 8px;
      align-items: center;
      margin-right: 8px;
    }

    .ttt__mode label { font-size: 13px; color: var(--muted); }

    .ttt__mode select {
      appearance: none;
      background: rgba(255,255,255,0.02);
      color: inherit;
      border: 1px solid rgba(255,255,255,0.06);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
    }

    @media (max-width: 420px) {
      :root { --mark-vw-factor: 18vw; }
      .ttt__container { padding: 14px; }
    }

  </style>
</head>
<body>
  <main class="ttt__container">
    <header>
      <h1>Tic Tac Toe</h1>
      <div class="ttt__status">
        <div id="statusMsg" class="ttt__status-msg" aria-live="polite">Waiting...</div>
        <div class="ttt__status-sub">Click a cell or use keyboard (Tab + Enter/Space)</div>
      </div>
    </header>

    <section class="ttt__board" role="grid" aria-label="Tic Tac Toe board">
      <button class="ttt__cell" data-index="0" aria-label="Row 1, Column 1, empty" aria-pressed="false"></button>
      <button class="ttt__cell" data-index="1" aria-label="Row 1, Column 2, empty" aria-pressed="false"></button>
      <button class="ttt__cell" data-index="2" aria-label="Row 1, Column 3, empty" aria-pressed="false"></button>
      <button class="ttt__cell" data-index="3" aria-label="Row 2, Column 1, empty" aria-pressed="false"></button>
      <button class="ttt__cell" data-index="4" aria-label="Row 2, Column 2, empty" aria-pressed="false"></button>
      <button class="ttt__cell" data-index="5" aria-label="Row 2, Column 3, empty" aria-pressed="false"></button>
      <button class="ttt__cell" data-index="6" aria-label="Row 3, Column 1, empty" aria-pressed="false"></button>
      <button class="ttt__cell" data-index="7" aria-label="Row 3, Column 2, empty" aria-pressed="false"></button>
      <button class="ttt__cell" data-index="8" aria-label="Row 3, Column 3, empty" aria-pressed="false"></button>
    </section>

    <div class="ttt__controls">
      <div style="display:flex; align-items:center; gap:12px;">
        <div class="ttt__mode">
          <label for="gameMode">Mode</label>
          <select id="gameMode" aria-label="Game mode">
            <option value="pvp">Two players</option>
            <option value="pvc_o">Play vs Computer (Computer = O)</option>
            <option value="pvc_x">Play vs Computer (Computer = X)</option>
          </select>
        </div>

        <div class="ttt__score">
          <span id="scoreX" class="ttt__score-item">X: 0</span>
          <span id="scoreO" class="ttt__score-item">O: 0</span>
          <span id="scoreD" class="ttt__score-item">Draws: 0</span>
        </div>
      </div>

      <div>
        <button id="newGame" class="ttt__btn ttt__btn--primary">New Game</button>
        <button id="resetScores" class="ttt__btn" title="Reset scores">Reset Scores</button>
      </div>
    </div>
  </main>

  <script>
    (function () {
      const cellEls = Array.from(document.querySelectorAll('.ttt__cell'));
      const statusEl = document.getElementById('statusMsg');
      const newGameBtn = document.getElementById('newGame');
      const resetScoresBtn = document.getElementById('resetScores');
      const scoreXEl = document.getElementById('scoreX');
      const scoreOEl = document.getElementById('scoreO');
      const scoreDEl = document.getElementById('scoreD');
      const gameModeEl = document.getElementById('gameMode');

      const WINNING_COMBOS = [
        [0,1,2], [3,4,5], [6,7,8],
        [0,3,6], [1,4,7], [2,5,8],
        [0,4,8], [2,4,6]
      ];

      // Visual mapping for marks (presentational only)
      const VISUAL_MARK = { X: 'X', O: 'O' };
      function playerName(p) {
        if (!p) return 'empty';
        const up = String(p).toUpperCase();
        if (up === 'X') return 'X';
        if (up === 'O') return 'O';
        return up;
      }

      let board = Array(9).fill('');
      let currentPlayer = 'X';
      let isGameActive = true;
      const SCORE = { X: 0, O: 0, draws: 0 };

      // Computer mode state
      let isVsComputer = false;
      let computerPlayer = 'O';
      let computerThinkingTimer = null;

      function init() {
        cellEls.forEach(cell => {
          cell.addEventListener('click', onCellClick);
          cell.addEventListener('keydown', onCellKeyDown);
        });

        newGameBtn.addEventListener('click', resetGame);
        resetScoresBtn.addEventListener('click', resetScores);

        gameModeEl.addEventListener('change', onModeChange);

        // initialize from current select value
        applyModeFromSelect();

        updateStatus(`Player ${playerName(currentPlayer)}'s turn`);
        render();
      }

      function onModeChange() {
        applyModeFromSelect();
        resetGame();
      }

      function applyModeFromSelect() {
        const v = gameModeEl.value;
        if (v === 'pvp') {
          isVsComputer = false;
        } else if (v === 'pvc_o') {
          isVsComputer = true;
          computerPlayer = 'O';
        } else if (v === 'pvc_x') {
          isVsComputer = true;
          computerPlayer = 'X';
        }
      }

      function onCellKeyDown(e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          e.target.click();
        }
      }

      function onCellClick(e) {
        const idx = Number(e.currentTarget.dataset.index);

        if (!isGameActive) {
          return;
        }

        // Ignore clicks when it's computer's turn
        if (isVsComputer && currentPlayer === computerPlayer) {
          return;
        }

        if (board[idx]) {
          return;
        }

        placeMove(idx);
      }

      function placeMove(idx) {
        // clear any pending thinking timer if human interrupts (rare)
        if (computerThinkingTimer) {
          clearTimeout(computerThinkingTimer);
          computerThinkingTimer = null;
        }

        board[idx] = currentPlayer;
        updateCellUI(idx);

        if (checkWin()) {
          isGameActive = false;
          // if vsComputer and the winner is the computer, show computer-specific message
          if (isVsComputer && currentPlayer === computerPlayer) {
            updateStatus(`Computer (${playerName(currentPlayer)}) wins! Click New Game to play again.`);
          } else {
            updateStatus(`Player ${playerName(currentPlayer)} wins! Click New Game to play again.`);
          }

          SCORE[currentPlayer] = SCORE[currentPlayer] + 1;
          updateScoreUI();

          return;
        }

        if (checkDraw()) {
          isGameActive = false;
          updateStatus('Draw! Click New Game to play again.');
          SCORE.draws = SCORE.draws + 1;
          updateScoreUI();

          return;
        }

        currentPlayer = currentPlayer === 'X' ? 'O' : 'X';

        // If it's computer's turn, show a special status
        if (isVsComputer && currentPlayer === computerPlayer) {
          updateStatus(`Computer (${playerName(currentPlayer)}) is thinking...`);
          // slight delay before AI plays
          computerThinkingTimer = setTimeout(() => {
            makeComputerMove();
            computerThinkingTimer = null;
          }, 300);
        } else {
          updateStatus(`Player ${playerName(currentPlayer)}'s turn`);
        }
      }

      function updateCellUI(idx) {
        const cell = cellEls[idx];
        const val = board[idx];
        // use plain marks for display while keeping board values as 'X'/'O'
        cell.textContent = val ? VISUAL_MARK[val] : '';
        cell.classList.remove('ttt__cell--x','ttt__cell--o');

        if (val) {
          cell.classList.add(`ttt__cell--${val.toLowerCase()}`);
        }

        const row = Math.floor(idx / 3) + 1;
        const col = (idx % 3) + 1;
        const label = `Row ${row}, Column ${col}, ${board[idx] ? playerName(board[idx]) : 'empty'}`;
        cell.setAttribute('aria-label', label);
        cell.setAttribute('aria-pressed', board[idx] ? 'true' : 'false');
      }

      function checkWin() {
        for (let i = 0; i < WINNING_COMBOS.length; i++) {
          const combo = WINNING_COMBOS[i];
          const a = combo[0];
          const b = combo[1];
          const c = combo[2];

          if (board[a] && board[a] === board[b] && board[a] === board[c]) {
            return true;
          }
        }

        return false;
      }

      function checkDraw() {
        return board.every(v => v);
      }

      function updateStatus(text) {
        statusEl.textContent = text;
      }

      function resetGame() {
        // clear any pending AI timer
        if (computerThinkingTimer) {
          clearTimeout(computerThinkingTimer);
          computerThinkingTimer = null;
        }

        board = Array(9).fill('');
        currentPlayer = 'X';
        isGameActive = true;

        cellEls.forEach((cell, i) => {
          cell.textContent = '';
          cell.classList.remove('ttt__cell--x','ttt__cell--o');

          const r = Math.floor(i / 3) + 1;
          const c = (i % 3) + 1;

          cell.setAttribute('aria-label', `Row ${r}, Column ${c}, empty`);
          cell.setAttribute('aria-pressed', 'false');
        });

        // if mode indicates computer is X and starts, ensure computer moves first
        updateStatus(`Player ${playerName(currentPlayer)}'s turn`);
        render();

        // focus first cell for accessibility
        try { cellEls[0].focus(); } catch (e) { /* ignore */ }

        if (isVsComputer && currentPlayer === computerPlayer) {
          // trigger computer move
          updateStatus(`Computer (${playerName(currentPlayer)}) is thinking...`);
          computerThinkingTimer = setTimeout(() => {
            makeComputerMove();
            computerThinkingTimer = null;
          }, 300);
        }
      }

      function resetScores() {
        SCORE.X = 0;
        SCORE.O = 0;
        SCORE.draws = 0;
        updateScoreUI();
      }

      function updateScoreUI() {
        scoreXEl.textContent = `X: ${SCORE.X}`;
        scoreOEl.textContent = `O: ${SCORE.O}`;
        scoreDEl.textContent = `Draws: ${SCORE.draws}`;
      }

      function render() {
        cellEls.forEach((cell, i) => {
          const val = board[i];
          cell.textContent = val ? VISUAL_MARK[val] : '';
          cell.classList.remove('ttt__cell--x','ttt__cell--o');

          if (val) {
            cell.classList.add(`ttt__cell--${val.toLowerCase()}`);
          }
        });

        updateScoreUI();
      }

      // --- AI helpers ---
      function getEmptyIndices() {
        const arr = [];
        for (let i = 0; i < board.length; i++) {
          if (!board[i]) arr.push(i);
        }
        return arr;
      }

      function wouldWinIf(player, idx) {
        // simulate placing 'player' at idx and check win
        const tmp = board.slice();
        tmp[idx] = player;

        for (let i = 0; i < WINNING_COMBOS.length; i++) {
          const [a,b,c] = WINNING_COMBOS[i];
          if (tmp[a] && tmp[a] === tmp[b] && tmp[a] === tmp[c]) return true;
        }

        return false;
      }

      function makeComputerMove() {
        if (!isGameActive) return;

        const me = computerPlayer;
        const opp = me === 'X' ? 'O' : 'X';
        const empty = getEmptyIndices();

        // 1) Win if possible
        for (let i = 0; i < empty.length; i++) {
          const idx = empty[i];
          if (wouldWinIf(me, idx)) {
            placeMove(idx);
            return;
          }
        }

        // 2) Block opponent win
        for (let i = 0; i < empty.length; i++) {
          const idx = empty[i];
          if (wouldWinIf(opp, idx)) {
            placeMove(idx);
            return;
          }
        }

        // 3) Take center
        if (!board[4]) {
          placeMove(4);
          return;
        }

        // 4) Take a corner
        const corners = [0,2,6,8].filter(i => !board[i]);
        if (corners.length > 0) {
          const choice = corners[Math.floor(Math.random() * corners.length)];
          placeMove(choice);
          return;
        }

        // 5) Take any side
        const sides = [1,3,5,7].filter(i => !board[i]);
        if (sides.length > 0) {
          const choice = sides[Math.floor(Math.random() * sides.length)];
          placeMove(choice);
          return;
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', init);
      } else {
        init();
      }

    })();
  </script>
</body>
</html>
